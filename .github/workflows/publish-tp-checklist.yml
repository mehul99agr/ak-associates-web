name: Publish Transfer Pricing Checklist Blog Post

on:
  schedule:
    - cron: '33 3 11 7 *'  # 3:33 AM UTC = 9:03 AM IST, July 11 2026

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Activate post in blog listing and sitemap
        run: |
          python3 - <<'EOF'
          import re

          # ── blog/page.tsx ──────────────────────────────────────────────
          with open('src/app/blog/page.tsx', 'r', encoding='utf-8') as f:
              content = f.read()

          new_entry = (
              "  {\n"
              "    title: 'Transfer Pricing Documentation Checklist for Indian Subsidiaries (2026)',\n"
              "    slug: 'transfer-pricing-documentation-checklist-india',\n"
              "    date: 'July 11, 2026',\n"
              "    category: 'International Tax',\n"
              "    summary: 'Complete TP documentation checklist: Form 3CEB vs Local File vs Master File thresholds, due dates, benchmarking requirements, and the documentation gaps that trigger transfer pricing audits.',\n"
              "  },\n"
          )
          content = content.replace('const posts = [\n', 'const posts = [\n' + new_entry, 1)

          with open('src/app/blog/page.tsx', 'w', encoding='utf-8') as f:
              f.write(content)
          print("Updated blog/page.tsx")

          # ── sitemap.ts ─────────────────────────────────────────────────
          with open('src/app/sitemap.ts', 'r', encoding='utf-8') as f:
              content = f.read()

          sitemap_entry = (
              "    { url: `${BASE_URL}/blog/transfer-pricing-documentation-checklist-india`,"
              " lastModified: new Date('2026-07-11'), changeFrequency: 'monthly', priority: 0.9 },\n"
          )
          target = "    { url: `${BASE_URL}/blog/tds-on-nri-property-sale-india`"
          content = content.replace(target, sitemap_entry + target, 1)

          with open('src/app/sitemap.ts', 'w', encoding='utf-8') as f:
              f.write(content)
          print("Updated sitemap.ts")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/blog/page.tsx src/app/sitemap.ts
          git commit -m "blog: publish transfer pricing documentation checklist (Jul 11)"
          git push origin main
